version: 2
models:
  - name: mart_outage_daily
    description: One row per grid per AST day, rebuilt from the raw polls by VI Update's rules.
    tests:
      - unique_combination: {arguments: {columns: [date_ast, district]}}
    columns:
      - name: district
        tests: [not_null, {accepted_values: {arguments: {values: [STX, STTJ]}}}]
      - name: covered_hours
        tests: [not_null]
      - name: customer_hours
        tests: [not_null]
  - name: mart_outage_monthly
    columns:
      - name: month
        tests: [not_null]
  - name: mart_outage_events
    description: District-wide (80%+) and major (25%+) outages.
    columns:
      - name: class
        tests: [{accepted_values: {arguments: {values: [districtwide_80pct, major_25pct]}}}]
      - name: peak_out
        tests: [not_null]
      - name: ends_by
        tests: [{accepted_values: {arguments: {values: [observed_drop, gap, capture_end]}}}]
  - name: mart_records
    columns:
      - name: record_id
        tests: [unique, not_null]
  - name: mart_area_customer_hours
    columns:
      - name: customer_hours
        tests: [not_null]
  - name: mart_gaps
    columns:
      - name: kind
        tests: [{accepted_values: {arguments: {values: [MISSING, STALE]}}}]
  - name: mart_current
    tests:
      - unique_combination: {arguments: {columns: [district]}}
  - name: mart_alerts
    columns:
      - name: alert_key
        tests: [unique, not_null]
  - name: mart_feeder_outages
    description: One row per whole-feeder outage on WAPA's map.
    columns:
      - name: record_id
        tests: [unique, not_null]
      - name: feeder
        tests: [not_null]
      - name: hours
        tests: [not_null]
  - name: mart_feeder_daily
    description: One row per feeder per AST day it was out.
    tests:
      - unique_combination: {arguments: {columns: [district, feeder, date_ast]}}
  - name: mart_feeder_scorecard
    description: One row per feeder - outages, hours, power-supply (rotation) load, neighborhoods.
    tests:
      - unique_combination: {arguments: {columns: [district, feeder]}}
    columns:
      - name: island
        tests: [not_null]
  - name: mart_schedule_check
    description: WAPA's rotation schedule against what WAPA's map showed.
    columns:
      - name: outcome
        tests: [not_null, {accepted_values: {arguments: {values: [on_schedule, ran_long, off_time, not_seen, still_out, upcoming, not_recorded, unscheduled]}}}]
